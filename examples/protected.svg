<svg xmlns="http://www.w3.org/2000/svg" width="960" height="422" viewBox="0 0 960 422" role="img" aria-labelledby="pocket-title pocket-desc"><title id="pocket-title">MoonPocket focus timeline</title><desc id="pocket-desc">Focus, busy, short gaps and recovery intervals. Fixed appointments are marked in the list.</desc><rect width="100%" height="100%" fill="#101b2d"/><g font-family="Arial,sans-serif" fill="#edf3ff"><text x="36" y="44" font-size="28">MoonPocket / time reclaimed</text><text x="36" y="76" font-size="16">09:00 - 18:00 | Focus 270 min | Free 360 min | Fragment 90 min</text><rect x="36" y="106" width="888" height="48" rx="6" fill="#475569"/><rect x="36" y="106" width="49" height="48" fill="#94a3b8"><title>09:00 - 09:30 / usable 30 min</title></rect><rect x="151" y="106" width="180" height="48" fill="#48d4ab"><title>10:10 - 12:00 / usable 110 min</title></rect><rect x="447" y="106" width="82" height="48" fill="#48d4ab"><title>13:10 - 14:00 / usable 50 min</title></rect><rect x="644" y="106" width="32" height="48" fill="#94a3b8"><title>15:10 - 15:30 / usable 20 min</title></rect><rect x="743" y="106" width="180" height="48" fill="#48d4ab"><title>16:10 - 18:00 / usable 110 min</title></rect><rect x="85" y="106" width="49" height="48" fill="#f6b56b"><title>standup / 09:30 - 10:00</title></rect><rect x="332" y="106" width="98" height="48" fill="#f6b56b"><title>lunch / 12:00 - 13:00</title></rect><rect x="529" y="106" width="98" height="48" fill="#f6b56b"><title>exam / 14:00 - 15:00</title></rect><rect x="677" y="106" width="49" height="48" fill="#f6b56b"><title>review / 15:30 - 16:00</title></rect><line x1="36" x2="36" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="36" y="100" text-anchor="middle" font-size="11">09:00</text><line x1="134" x2="134" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="134" y="100" text-anchor="middle" font-size="11">10:00</text><line x1="233" x2="233" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="233" y="100" text-anchor="middle" font-size="11">11:00</text><line x1="332" x2="332" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="332" y="100" text-anchor="middle" font-size="11">12:00</text><line x1="430" x2="430" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="430" y="100" text-anchor="middle" font-size="11">13:00</text><line x1="529" x2="529" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="529" y="100" text-anchor="middle" font-size="11">14:00</text><line x1="628" x2="628" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="628" y="100" text-anchor="middle" font-size="11">15:00</text><line x1="726" x2="726" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="726" y="100" text-anchor="middle" font-size="11">16:00</text><line x1="825" x2="825" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="825" y="100" text-anchor="middle" font-size="11">17:00</text><line x1="924" x2="924" y1="96" y2="154" stroke="#101b2d" stroke-opacity="0.35"/><text x="924" y="100" text-anchor="middle" font-size="11">18:00</text><text x="36" y="180" font-size="13">Green: focus | Orange: busy | Light grey: short gap | Dark grey: recovery</text><text x="36" y="214" font-size="15">09:30 - 10:00 / standup</text><text x="36" y="240" font-size="15">12:00 - 13:00 / lunch [fixed]</text><text x="36" y="266" font-size="15">14:00 - 15:00 / exam [fixed]</text><text x="36" y="292" font-size="15">15:30 - 16:00 / review</text><text x="36" y="330" font-size="15" fill="#48d4ab">Move standup out of this day: +70 focus min</text><text x="36" y="354" font-size="15" fill="#48d4ab">Move review out of this day: +60 focus min</text></g></svg>