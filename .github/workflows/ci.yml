name: MoonPocket checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon fmt --check
      - run: moon check --target js --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon build --target js src/cmd/moonpocket
      - run: node --test tests/cli.integration.test.mjs
      - name: Verify distribution archive in an isolated directory
        run: node tests/package.integration.mjs
